name: IoT Fleet Platform CI/CD & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # =======================================================
  # JOB 1: TERRAFORM LINT & SECURITY SCAN
  # =======================================================
  terraform-quality:
    name: "Terraform Lint & Checkov Scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest" #v1.15.6 - tested

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          soft_fail: true # Logs security findings without failing the build pipeline
          output_format: cli

  # =======================================================
  # JOB 2: FRONTEND LINT & BUILD TEST
  # =======================================================
  frontend-quality:
    name: "Astro Frontend Build Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1" #v24.16.0 - tested
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Static Site (Validation)
        run: npm run build
        env:
          PUBLIC_API_GATEWAY_URL: "https://api.example.com"
          PUBLIC_COGNITO_USER_POOL_ID: "ap-southeast-2_dummy"
          PUBLIC_COGNITO_CLIENT_ID: "dummyclientid12345"
          PUBLIC_AWS_REGION: "ap-southeast-2"

  # =======================================================
  # JOB 3: TERRAFORM DEPLOYMENT (Pushes to Main Only)
  # =======================================================
  terraform-deploy:
    name: "Terraform Apply"
    needs: [terraform-quality, frontend-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest" #v1.15.6 - tested

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color > /dev/null

  # =======================================================
  # JOB 4: FRONTEND DEPLOYMENT TO S3 & CLOUDFRONT
  # =======================================================
  frontend-deploy:
    name: "Deploy Frontend to S3 & CloudFront"
    needs: [terraform-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest" #v1.15.6 - tested

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1" #v24.16.0 - tested
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Fetch Terraform Outputs
        id: tf-outputs
        run: |
          cd terraform
          terraform init
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          echo "CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> $GITHUB_ENV
          echo "COGNITO_POOL=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "COGNITO_CLIENT=$(terraform output -raw cognito_app_client_id)" >> $GITHUB_ENV

      - name: Build Astro Production Assets
        run: npm run build
        working-directory: ./frontend
        env:
          PUBLIC_API_GATEWAY_URL: ${{ env.API_URL }}
          PUBLIC_COGNITO_USER_POOL_ID: ${{ env.COGNITO_POOL }}
          PUBLIC_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT }}
          PUBLIC_AWS_REGION: "ap-southeast-2"

      - name: Sync Static Assets to S3
        run: aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront CDN Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CF_DIST_ID }} --paths "/*"